name: Bug report
description: Report a reproducible problem with the unofficial Grok Bot Flatpak
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this unofficial Flatpak. Do not include credentials, authentication callbacks, tokens, or other secrets.

  - type: input
    id: summary
    attributes:
      label: Problem summary
      description: Briefly describe the problem.
      placeholder: Grok Bot does not...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Launch Grok Bot
        2. Perform the affected action
        3. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happens now, including any visible error.
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Select the architecture of the installed Flatpak.
      options:
        - x86_64
        - aarch64
        - Other or unknown
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Desktop environment
      description: Include the desktop environment and version when known.
      placeholder: KDE Plasma 6.x
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Installed version
      description: Provide the Grok Bot or Flatpak version when available.
      placeholder: 1.2.3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only bounded, relevant output after removing secrets and private data.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: I removed credentials, tokens, authentication callbacks, and other secrets.
          required: true
