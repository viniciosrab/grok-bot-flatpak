# Validate job: dual-architecture build plus payload and launch proof.
#
# Both architectures build natively (x86_64 on ubuntu-24.04, aarch64 on
# ubuntu-24.04-arm) with fail-fast disabled so each arch reports its own
# verdict. Any source, payload, or runtime failure fails that architecture
# and blocks the atomic publish gate. Nothing here publishes.
#
# X3 contract (design: Electron/zypak on KDE 6.11): an architecture counts
# as X3-validated ONLY when the X3 launch-proof step below observes a real
# graphical KDE launch (exit 0). The watcher-gate rejection step is a
# negative test — it proves the companion fails closed without a
# StatusNotifierWatcher — and MUST NEVER be read as X3 launch success.
# Headless runners fail the X3 step closed (UNPROVEN); the arch stays
# unvalidated until graphical launch evidence exists.

name: validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the workspace gate
        run: |
          set -euo pipefail
          python3 tools/test.py

  build-x86_64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the x86_64 Source Checksum
        run: |
          set -euo pipefail
          URL="$(grep -A3 'x86_64:' data/pins.yml | grep 'url:' | awk '{print $2}')"
          DIGEST="$(grep -A3 'x86_64:' data/pins.yml | grep 'sha256:' | awk '{print $2}')"
          test -n "${URL}" || { echo "missing x86_64 pin" >&2; exit 1; }
          test -n "${DIGEST}" || { echo "missing x86_64 digest" >&2; exit 1; }
          curl -sSL --fail -o upstream.AppImage "${URL}"
          printf '%s  %s\n' "${DIGEST}" upstream.AppImage | sha256sum -c -
          test "$(stat -c%s upstream.AppImage)" -gt 0 || { echo "empty artifact" >&2; exit 1; }

      - name: Install the Flatpak toolchain and KDE 6.11 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the x86_64 payload
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=repo build-dir io.github.viniciosrab.GrokBot.yml

      - name: Prove the vendor icon and companion Exec
        run: |
          set -euo pipefail
          test -f build-dir/files/share/icons/hicolor/512x512/apps/grok-bot.png || { echo "missing Official Grok Bot Icon" >&2; exit 1; }
          test -d build-dir/files/share/icons/hicolor || { echo "missing vendor hicolor tree" >&2; exit 1; }
          grep -q '^Exec=/app/bin/grok-bot-companion$' build-dir/files/share/applications/io.github.viniciosrab.GrokBot.desktop || { echo "desktop Exec must launch the companion" >&2; exit 1; }
          grep -q 'org.kde.StatusNotifierWatcher' io.github.viniciosrab.GrokBot.yml || { echo "missing StatusNotifierWatcher talk-name" >&2; exit 1; }
          test -x build-dir/files/bin/grok-bot-companion || { echo "missing companion binary" >&2; exit 1; }

      - name: Prove the watcher gate rejects a watcherless session (NOT X3 launch proof)
        run: |
          set -euo pipefail
          set +e
          timeout 60 flatpak-builder --run build-dir io.github.viniciosrab.GrokBot.yml /app/bin/grok-bot-companion >launch.log 2>&1
          RC=$?
          set -e
          cat launch.log
          grep -q 'StatusNotifierWatcher' launch.log || { echo "watcher gate went silent" >&2; exit 1; }
          test "${RC}" -eq 1 || { echo "headless launch must fail closed at the watcher gate" >&2; exit 1; }
          echo "NEGATIVE TEST ONLY: companion rejects a watcherless session with exit 1."
          echo "This is NOT X3 launch proof and does NOT validate this architecture for X3."

      - name: X3 launch proof — Electron/zypak on KDE 6.11 (fail-closed)
        run: |
          set -euo pipefail
          # X3: companion is a long-running tray. PASS only with positive
          # proof of org.kde.StatusNotifierWatcher on the session bus AND
          # the companion staying alive under it; exit 0 is not expected.
          prove_x3() {
            local wrap="$1"
            local bus_names=""
            if command -v busctl >/dev/null 2>&1; then
              bus_names="$(busctl --user list 2>/dev/null || true)"
            elif command -v gdbus >/dev/null 2>&1; then
              bus_names="$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.ListNames 2>/dev/null || true)"
            elif command -v dbus-send >/dev/null 2>&1; then
              bus_names="$(dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.ListNames 2>/dev/null || true)"
            else
              echo "X3 launch proof UNPROVEN: no D-Bus probe (busctl/gdbus/dbus-send) to verify StatusNotifierWatcher" >&2
              return 1
            fi
            case "${bus_names}" in
              *org.kde.StatusNotifierWatcher*)
                echo "StatusNotifierWatcher present on the session bus"
                ;;
              *)
                echo "X3 launch proof UNPROVEN: org.kde.StatusNotifierWatcher not on the session bus" >&2
                return 1
                ;;
            esac
            set +e
            if [ -n "${wrap}" ]; then
              ${wrap} flatpak-builder --run build-dir io.github.viniciosrab.GrokBot.yml /app/bin/grok-bot-companion >x3-launch.log 2>&1 &
            else
              flatpak-builder --run build-dir io.github.viniciosrab.GrokBot.yml /app/bin/grok-bot-companion >x3-launch.log 2>&1 &
            fi
            local pid=$!
            sleep 8
            if kill -0 "${pid}" 2>/dev/null; then
              kill "${pid}" 2>/dev/null || true
              wait "${pid}" 2>/dev/null || true
              set -e
              cat x3-launch.log
              echo "X3 launch proof: PASS — watcher-verified companion stayed up (tray process)"
              return 0
            fi
            wait "${pid}"
            local rc=$?
            set -e
            cat x3-launch.log
            echo "X3 launch proof FAILED: companion exited ${rc}" >&2
            return 1
          }
          if [ -n "${DISPLAY:-}" ] || [ -n "${WAYLAND_DISPLAY:-}" ]; then
            echo "graphical session detected; attempting X3 Electron/zypak launch proof"
            prove_x3 ""
          elif command -v xvfb-run >/dev/null 2>&1; then
            echo "no graphical session; attempting X3 launch under xvfb-run (still requires a StatusNotifierWatcher)"
            prove_x3 "xvfb-run -a" || { echo "This architecture is NOT validated for X3. Failing closed." >&2; exit 1; }
          else
            echo "X3 launch proof UNPROVEN: no graphical KDE session (DISPLAY and WAYLAND_DISPLAY unset) and no xvfb-run on this runner" >&2
            echo "This architecture is NOT validated for X3. Failing closed." >&2
            exit 1
          fi

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    steps:
      - name: Check out the repository
