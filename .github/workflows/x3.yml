# X3 proof job: explicit manual graphical proof (Electron/zypak on KDE 6.11).
#
# This workflow NEVER runs automatically on ordinary pull requests: it is
# workflow_dispatch only, because hosted runners lack the graphical KDE
# infrastructure X3 requires. An architecture counts as X3-proven ONLY when
# its job observes a real graphical KDE session, a real session-bus
# org.kde.StatusNotifierWatcher, and the companion staying alive under it.
# The watcher is never provisioned or faked here; without it the job fails
# closed (UNPROVEN). A successful X3 run on the main branch is the only
# signal that authorizes publication consideration in the publish
# workflow; validate success alone never does.

name: x3

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  proof-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the x86_64 Source Checksum
        run: |
          set -euo pipefail
          URL="$(grep -A3 'x86_64:' data/pins.yml | grep 'url:' | awk '{print $2}')"
          DIGEST="$(grep -A3 'x86_64:' data/pins.yml | grep 'sha256:' | awk '{print $2}')"
          test -n "${URL}" || { echo "missing x86_64 pin" >&2; exit 1; }
          test -n "${DIGEST}" || { echo "missing x86_64 digest" >&2; exit 1; }
          curl -sSL --fail -o upstream.AppImage "${URL}"
          printf '%s  %s\n' "${DIGEST}" upstream.AppImage | sha256sum -c -
          test "$(stat -c%s upstream.AppImage)" -gt 0 || { echo "empty artifact" >&2; exit 1; }

      - name: Install the Flatpak toolchain and KDE 6.11 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the x86_64 payload
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=repo build-dir io.github.viniciosrab.GrokBot.yml

      - name: X3 launch proof — Electron/zypak on KDE 6.11 (fail-closed)
        run: |
          set -euo pipefail
          # X3: companion is a long-running tray. PASS only with positive
          # proof of org.kde.StatusNotifierWatcher on the session bus AND
          # the companion staying alive under it; exit 0 is not expected.
          prove_x3() {
            local wrap="$1"
            local bus_names=""
            if command -v busctl >/dev/null 2>&1; then
              bus_names="$(busctl --user list 2>/dev/null || true)"
            elif command -v gdbus >/dev/null 2>&1; then
              bus_names="$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.ListNames 2>/dev/null || true)"
            elif command -v dbus-send >/dev/null 2>&1; then
              bus_names="$(dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.ListNames 2>/dev/null || true)"
            else
              echo "X3 launch proof UNPROVEN: no D-Bus probe (busctl/gdbus/dbus-send) to verify StatusNotifierWatcher" >&2
              return 1
            fi
            case "${bus_names}" in
              *org.kde.StatusNotifierWatcher*)
                echo "StatusNotifierWatcher present on the session bus"
                ;;
              *)
                echo "X3 launch proof UNPROVEN: org.kde.StatusNotifierWatcher not on the session bus" >&2
                return 1
                ;;
            esac
            set +e
            if [ -n "${wrap}" ]; then
              ${wrap} flatpak-builder --run build-dir io.github.viniciosrab.GrokBot.yml /app/bin/grok-bot-companion >x3-launch.log 2>&1 &
            else
              flatpak-builder --run build-dir io.github.viniciosrab.GrokBot.yml /app/bin/grok-bot-companion >x3-launch.log 2>&1 &
            fi
            local pid=$!
            sleep 8
            if kill -0 "${pid}" 2>/dev/null; then
              kill "${pid}" 2>/dev/null || true
              wait "${pid}" 2>/dev/null || true
              set -e
              cat x3-launch.log
              echo "X3 launch proof: PASS — watcher-verified companion stayed up (tray process)"
              return 0
            fi
            wait "${pid}"
            local rc=$?
            set -e
            cat x3-launch.log
            echo "X3 launch proof FAILED: companion exited ${rc}" >&2
            return 1
          }
          if [ -n "${DISPLAY:-}" ] || [ -n "${WAYLAND_DISPLAY:-}" ]; then
            echo "graphical session detected; attempting X3 Electron/zypak launch proof"
            prove_x3 ""
          elif command -v xvfb-run >/dev/null 2>&1; then
            echo "no graphical session; attempting X3 launch under xvfb-run (still requires a StatusNotifierWatcher)"
            prove_x3 "xvfb-run -a" || { echo "This architecture is NOT validated for X3. Failing closed." >&2; exit 1; }
          else
            echo "X3 launch proof UNPROVEN: no graphical KDE session (DISPLAY and WAYLAND_DISPLAY unset) and no xvfb-run on this runner" >&2
            echo "This architecture is NOT validated for X3. Failing closed." >&2
            exit 1
          fi

