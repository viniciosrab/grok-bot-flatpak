# X3 proof job: automatic hosted graphical proof (Electron/zypak on KDE 6.11).
#
# Chain: successful validate on main -> X3 -> publish. This workflow runs
# automatically when validate completes on main and stays available as a
# manual workflow_dispatch run for diagnosis. Each architecture runs on
# GitHub-hosted runners (x86_64 on ubuntu-24.04, aarch64 on
# ubuntu-24.04-arm) and calls the single shared tools/prove_x3.sh proof,
# which starts the real kactivitymanagerd before a real KDE Plasma
# plasmashell process on Xvfb under a real D-Bus session, proves ownership
# of the real
# org.kde.StatusNotifierWatcher name via GetNameOwner, then launches the
# Packaged Payload through the companion and proves the companion stays
# alive with zombie-safe observation and process-group cleanup. No watcher
# service is provisioned here; without the real watcher the job fails
# closed (UNPROVEN). An explicit gate job fails closed on any workflow_run
# not caused by successful push on main, so skipped proof never reads as
# success. Both architectures must pass or publish never runs. Checkouts
# use the triggering run head SHA with explicit manual fallback, never
# implicit default-branch bytes.

name: x3

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on unexpected validate trigger
        env:
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "validate conclusion: ${TRIGGER_CONCLUSION}"
          echo "validate event: ${TRIGGER_EVENT}"
          echo "validate head branch: ${TRIGGER_BRANCH}"
          if [ "${TRIGGER_CONCLUSION}" = "success" ] && [ "${TRIGGER_EVENT}" = "push" ] && [ "${TRIGGER_BRANCH}" = "main" ]; then
            echo "gate: valid main-line validate chain"
            exit 0
          fi
          echo "gate: unexpected X3 trigger (not successful push on main); failing closed" >&2
          exit 1

  proof-x86_64:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          # Automatic runs use the triggering validate head SHA; manual
          # runs fall back explicitly to the dispatch SHA.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify the x86_64 Source Checksum
        run: |
          set -euo pipefail
          URL="$(grep -A3 'x86_64:' data/pins.yml | grep 'url:' | awk '{print $2}')"
          DIGEST="$(grep -A3 'x86_64:' data/pins.yml | grep 'sha256:' | awk '{print $2}')"
          test -n "${URL}" || { echo "missing x86_64 pin" >&2; exit 1; }
          test -n "${DIGEST}" || { echo "missing x86_64 digest" >&2; exit 1; }
          curl -sSL --fail -o upstream.AppImage "${URL}"
          printf '%s  %s\n' "${DIGEST}" upstream.AppImage | sha256sum -c -
          test "$(stat -c%s upstream.AppImage)" -gt 0 || { echo "empty artifact" >&2; exit 1; }

      - name: Install the Flatpak toolchain and KDE 6.11 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the x86_64 payload
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=repo build-dir io.github.viniciosrab.GrokBot.yml

      - name: Install hosted KDE proof dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y plasma-workspace xvfb dbus-x11 kactivitymanagerd

      - name: X3 launch proof — Electron/zypak on KDE 6.11 (fail-closed, hosted)
        run: |
          set -euo pipefail
          # Single shared proof for both architectures. tools/prove_x3.sh
          # runs real plasmashell on Xvfb with owner proof and zombie-safe
          # observation; any failure exits nonzero so publish never runs.
          bash tools/prove_x3.sh

  proof-aarch64:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          # Automatic runs use the triggering validate head SHA; manual
          # runs fall back explicitly to the dispatch SHA.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify the aarch64 Source Checksum
        run: |
          set -euo pipefail
          URL="$(grep -A3 'aarch64:' data/pins.yml | grep 'url:' | awk '{print $2}')"
          DIGEST="$(grep -A3 'aarch64:' data/pins.yml | grep 'sha256:' | awk '{print $2}')"
          test -n "${URL}" || { echo "missing aarch64 pin" >&2; exit 1; }
          test -n "${DIGEST}" || { echo "missing aarch64 digest" >&2; exit 1; }
          curl -sSL --fail -o upstream.AppImage "${URL}"
          printf '%s  %s\n' "${DIGEST}" upstream.AppImage | sha256sum -c -
          test "$(stat -c%s upstream.AppImage)" -gt 0 || { echo "empty artifact" >&2; exit 1; }

      - name: Install the Flatpak toolchain and KDE 6.11 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the aarch64 payload
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=repo build-dir io.github.viniciosrab.GrokBot.yml

      - name: Install hosted KDE proof dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y plasma-workspace xvfb dbus-x11 kactivitymanagerd

      - name: X3 launch proof — Electron/zypak on KDE 6.11 (fail-closed, hosted)
        run: |
          set -euo pipefail
          # Single shared proof for both architectures. tools/prove_x3.sh
          # runs real plasmashell on Xvfb with owner proof and zombie-safe
          # observation; any failure exits nonzero so publish never runs.
          bash tools/prove_x3.sh
